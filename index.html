<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
  <main>

    <nav>
      
        <h3>Kanban Board</h3>
        <div> <button class="total_task">Total tasks : 0 </button>
        <button class="theme">Light</button>
        <button class="addTask" id="toggle-model">Add a Task</button></div>
       
    </nav>

    <section class="board">

        <div id="todo" class="block">
            <div class="taskNav">
                <h3>To Do</h3>
              <p id="todoCount">Count : 0</p>
            </div>
        </div>

         <div id="progress" class="block">
             <div class="taskNav">
                <h3>In Progress</h3>
                <p id="progressCount">Count : 0</p>
            </div>

        
         </div>

          <div id="done" class="block">
             <div class="taskNav">
                <h3>Done</h3>
                <p id="doneCount">Count : 0</p>
            </div>

            
          </div>
    </section>
  </main>
  
  <div class="model active add-new-task">
    <div class="bg"></div>
    <div class="center">
        <button class="cross">&times</button>
    <input type="text" placeholder="Task Title">
    <textarea placeholder="Task Description"></textarea>
    <button id="add_new" class="add_task _btn">Add Task</button>
  </div>
  </div>
<script src="index.js"></script>
</body>
</html>
